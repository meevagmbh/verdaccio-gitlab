approvedGitRepositories:
  - '**'

enableImmutableInstalls: true

enableScripts: false

nodeLinker: node-modules

# Advisories reviewed and accepted, so `yarn npm audit` reports only new ones.
# Remove an entry once a dependency update fixes it.
npmAuditIgnoreAdvisories:
  # GHSA-g3hv-75wg-m249, minimatch <11.0.1: CPU/memory DoS when an attacker
  # supplies the glob pattern (with optimizationLevel >= 2). @verdaccio/core
  # 8.4.0 pins minimatch 10.2.6 and compiles only the package patterns from
  # the operator's config; package names are matched against them, never
  # used as patterns. No override is possible: minimatch 11 removes the
  # makeRe() that @verdaccio/core calls. Revisit with @verdaccio/core 9.
  - '1244623'

npmMinimalAgeGate: 7d

# Do not add @types packages to package.json behind our back.
tsEnableAutoTypes: false
