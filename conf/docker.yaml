storage: /verdaccio/storage/data

plugins: /verdaccio/plugins

listen:
  - 0.0.0.0:4873

auth:
  gitlab:
    url: http://gitlab
    # The compose network reaches GitLab over plain http only.
    allowInsecureHttp: true
    authCache:
      enabled: true
      ttl: 300
    access: $reporter
    publish: $maintainer

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

packages:
  # Private packages: only members of the matching GitLab group or project,
  # with at least the auth.gitlab.access role, can read them. Use one entry
  # per GitLab group that publishes packages.
  '@my-group/*':
    access: $authenticated
    publish: $authenticated
    gitlab: true

  # Public packages from npmjs: $all keeps them readable for everyone.
  # Publishing is still checked against GitLab.
  '@*/*':
    access: $all
    publish: $authenticated
    proxy: npmjs
    gitlab: true

  '**':
    access: $all
    publish: $authenticated
    proxy: npmjs
    gitlab: true

# verdaccio 5+ takes a single `log` object; the `logs` list is deprecated.
log: { type: stdout, format: pretty, level: info }
