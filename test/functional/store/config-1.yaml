storage: ./test-storage1

max_users: 2

web:
  enable: true
  title: verdaccio-gitlab-server-1

auth:
  gitlab:
    url: http://localhost:50080/
    allowInsecureHttp: true
    authCache:
      enabled: false
    access: $reporter
    publish: $maintainer

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

log: { type: stdout, format: pretty, level: trace }

packages:
  # A public upstream package: $all keeps it readable without membership.
  'verdaccio':
    access: $all
    publish: $authenticated
    storage: false
    gitlab: true
    proxy: npmjs

  # Private packages: readable by members of the matching group or project.
  '@test-group/*':
    access: $authenticated
    publish: $authenticated
    gitlab: true

  '@read-group/*':
    access: $authenticated
    publish: $authenticated
    gitlab: true

  '@foreign-group/*':
    access: $authenticated
    publish: $authenticated
    gitlab: true

  # Like a section proxying public npm packages: any logged-in user may
  # read, nobody may publish, and verdaccio checks it without the plugin.
  '@open/*':
    access: $authenticated

  '@*/*':
    access: $all
    publish: $all
    gitlab: true

  '**':
    access: $all
    publish: $authenticated
    gitlab: true

# expose internal methods
_debug: true
