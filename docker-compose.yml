# Local demo: a GitLab and a verdaccio with this plugin. Not a production
# setup. Set GITLAB_ROOT_PASSWORD before the first start, e.g. in a .env file.
services:
  gitlab:
    # A fixed release, so the demo behaves the same on every start.
    image: 'gitlab/gitlab-ce:19.4.7-ce.0'
    restart: unless-stopped
    environment:
      GITLAB_ROOT_PASSWORD: '${GITLAB_ROOT_PASSWORD:?set GITLAB_ROOT_PASSWORD for the GitLab root user}'
    ports:
      - '50080:80'
      - '50022:22'
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-log:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab

  verdaccio:
    restart: unless-stopped
    ports:
      - '4873:4873'
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - verdaccio-storage:/verdaccio/storage
    depends_on:
      - gitlab

volumes:
  gitlab-config:
  gitlab-log:
  gitlab-data:
  verdaccio-storage:
