name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep every master run; cancel superseded runs on branches and PRs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

# Each Node job uses the Node version from .nvmrc and the yarn version pinned in
# package.json#packageManager (via corepack). setup-node's cache is off because it
# would run before corepack has put yarn 4 on the PATH.
jobs:
  lint:
    name: Lint, type-check, format, licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn license
      - run: yarn lint
      - run: yarn format:check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test:unit

  functional:
    name: Functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn code:build
      - run: yarn test:functional

  docker:
    name: Docker image build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t verdaccio-gitlab:ci .
      - name: Smoke-test the image
        run: sh scripts/docker-smoke-test.sh verdaccio-gitlab:ci

  actions-lock:
    name: Actions lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Fails if .github/workflows/actions.lock is out of sync with the
      # workflows or a locked commit no longer verifies upstream.
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - name: Lint commit messages of the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: yarn commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
