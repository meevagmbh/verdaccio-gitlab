name: Release

# A vX.Y.Z tag (pushed by scripts/release.sh) builds the Docker image from
# that tag, smoke-tests it and pushes it to the GitHub container registry as
# ghcr.io/<owner>/verdaccio-gitlab, tagged as scripts/image-tags.sh says.
# It also attests the image's build provenance, so users can check with
# `gh attestation verify` that an image was built here from a given commit.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build, smoke-test and push the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Only for actions/attest: sign the provenance with a short-lived OIDC
      # token, store the attestation, and record where the image is stored.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t verdaccio-gitlab:release .

      - name: Smoke-test the image
        run: sh scripts/docker-smoke-test.sh verdaccio-gitlab:release

      - name: Push the image
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/verdaccio-gitlab"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in $(sh scripts/image-tags.sh "$VERSION"); do
            docker tag verdaccio-gitlab:release "$image:$tag"
            docker push "$image:$tag"
          done
          # All tags point to the same image; attest it once by the digest
          # the registry reports for it.
          digest="$(docker buildx imagetools inspect "$image:$VERSION" --format '{{.Manifest.Digest}}')"
          if [ -z "$digest" ]; then
            echo "no registry digest for $image after the push" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "Pushed \`$image\` with tags:"
            sh scripts/image-tags.sh "$VERSION" | sed 's/^/- /'
            echo
            echo "Digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          # Uses the registry login from the push step.
          push-to-registry: true

      - name: Log out of the registry
        if: always()
        run: docker logout ghcr.io
