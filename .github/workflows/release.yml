name: Release

# A vX.Y.Z tag (pushed by scripts/release.sh) builds the Docker image from
# that tag, smoke-tests it and pushes it to the GitHub container registry as
# ghcr.io/<owner>/verdaccio-gitlab, tagged as scripts/image-tags.sh says.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build, smoke-test and push the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t verdaccio-gitlab:release .

      - name: Smoke-test the image
        run: sh scripts/docker-smoke-test.sh verdaccio-gitlab:release

      - name: Push the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/verdaccio-gitlab"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in $(sh scripts/image-tags.sh "$VERSION"); do
            docker tag verdaccio-gitlab:release "$image:$tag"
            docker push "$image:$tag"
          done
          docker logout ghcr.io
          {
            echo "Pushed \`$image\` with tags:"
            sh scripts/image-tags.sh "$VERSION" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
